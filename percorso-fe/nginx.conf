# percorso-fe/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: ogni path non-asset va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy verso il mock-api per le chiamate /api/*
    location /api/ {
        # Il nome si risolve a ogni richiesta con il DNS interno di Docker (127.0.0.11): Nginx parte
        # anche dove il mock-api non c'è (immagine avviata da sola, cluster) e lì /api risponde 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $mock_api http://mock-api:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $mock_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache aggressivo per asset hashati di Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
